# =========================================================================
# HYPRLOCK - BALANCED TRIPLE-CARD UNSC HUD (ALBUM ART | MAIN HUD | SCRIPTURE)
# =========================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.2
}

# =========================================================================
# CARD 1: ALBUM ART & MEDIA CONTROLS (LEFT CARD - AT -310)
# =========================================================================
shape {
    monitor =
    size = 280, 480
    color = rgba(10, 22, 36, 0.70)
    border_size = 2
    border_color = rgba(0, 229, 255, 0.6)   # UNSC Cyan Visor Border
    rounding = 24
    position = -310, 0
    halign = center
    valign = center
}

# Live Cover Art Display
image {
    monitor =
    path = /tmp/hyprlock_cover.png          # Points directly to the generated cover file
    size = 170
    border_size = 2
    border_color = rgba(255, 232, 0, 0.8)   # Gold Shield Ring
    rounding = 16
    position = -310, 100
    halign = center
    valign = center
}

# Song Title & Artist
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/get_song.sh
    color = rgba(255, 232, 0, 0.95)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = -310, -50
    halign = center
    valign = center
}

# Playback Status
label {
    monitor =
    text = cmd[update:1000] playerctl status 2>/dev/null | grep -q "Playing" && echo "󰏤  PLAYING" || echo "󰐊  PAUSED"
    color = rgba(0, 229, 255, 0.90)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -310, -110
    halign = center
    valign = center
}

# Key Guide / Media Controls
label {
    monitor =
    text = 󰒮 PREV  |  󰐊 PLAY  |  󰒍 NEXT
    color = rgba(205, 214, 244, 0.6)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = -310, -160
    halign = center
    valign = center
}

# =========================================================================
# CARD 2: MAIN FLOATING GLASS CARD (CENTER PANEL - AT 0,0)
# =========================================================================
shape {
    monitor =
    size = 300, 480
    color = rgba(10, 22, 36, 0.70)
    border_size = 2
    border_color = rgba(0, 229, 255, 0.6)
    rounding = 24
    position = 0, 0
    halign = center
    valign = center
}

# OS Logo Widget
image {
    monitor =
    path = /home/rickey/.config/hypr/assets/nixos.png
    size = 56
    border_size = 0
    rounding = -1
    position = 0, 150
    halign = center
    valign = center
}

# 12-Hour Time Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(255, 232, 0, 1.0)          # Halo Gold
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Date Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(0, 229, 255, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

# Spartan Password Input Field
input-field {
    monitor =
    size = 250, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = 12
    
    outer_color = rgba(0, 229, 255, 0.8)       # UNSC Shield Blue
    inner_color = rgba(18, 38, 58, 0.85)       # Dark Cockpit Accent
    font_color = rgba(255, 232, 0, 1.0)        # Gold Text
    fade_on_empty = false
    
    placeholder_text = ENTER CLEARANCE CODE...
    fail_text = CLEARANCE DENIED
    
    hide_input = false
    position = 0, -55
    halign = center
    valign = center
}

# =========================================================================
# CARD 3: SCRIPTURE WINDOW (RIGHT CARD - SHIFTED TO 310)
# =========================================================================
shape {
    monitor =
    size = 280, 480
    color = rgba(10, 22, 36, 0.70)
    border_size = 2
    border_color = rgba(255, 232, 0, 0.6)   # Halo Gold Border
    rounding = 24
    position = 310, 0
    halign = center
    valign = center
}

# Scripture Header
label {
    monitor =
    text = 📖 SCRIPTURE
    color = rgba(255, 232, 0, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 310, 200
    halign = center
    valign = center
}

# John 3:16 (Top Passage)
label {
    monitor =
    text = "For God so loved<br/>the world, that he<br/>gave his only<br/>begotten Son, that<br/>whosoever believeth<br/>in him should not<br/>perish, but have<br/>everlasting life."<br/><br/>— <b>John 3:16</b>
    color = rgba(205, 214, 244, 0.95)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = 310, 50
    halign = center
    valign = center
}

# Ephesians 6:11 (Bottom Passage)
label {
    monitor =
    text = "Put on the whole<br/>armour of God, that<br/>ye may be able to<br/>stand against the<br/>wiles of the devil."<br/><br/>— <b>Ephesians 6:11</b>
    color = rgba(0, 229, 255, 0.90)       # UNSC Cyan Accent
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    text_align = center
    position = 310, -120
    halign = center
    valign = center
}