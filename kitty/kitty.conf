cat << 'EOF' > ~/.config/kitty/kitty.conf
# =========================================================================
# KITTY CONFIGURATION (HELLDIVERS TACTICAL AMBER)
# =========================================================================

# --- Shell Integration ---
shell_integration enabled

# --- Font Config ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Transparency ---
background_opacity 0.72
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no

# --- Cursor Customization ---
cursor_shape beam
cursor_blink_interval 0.4
cursor #FFE135

# --- Color Scheme (Super Earth Gold & High-Tech Carbon) ---
foreground           #FFE135
background           #0B0E14
selection_foreground #0B0E14
selection_background #FFCC00

# Black / Grey
color0 #151921
color8 #4A5568

# Red / Warning Crimson
color1 #FF3344
color9 #FF5566

# Green / Tactical Lime
color2  #00FF88
color10 #33FF99

# Yellow / Helldivers Super Gold
color3  #FFE135
color11 #FFF066

# Blue / Stratagem Tactical Cyan
color4  #00E5FF
color12 #33EBFF

# Purple / Hazard Magenta
color5  #D946EF
color13 #E879F9

# Cyan / Data Blue
color6  #38BDF8
color14 #7DD3FC

# White / Crisp Radar Text
color7  #E2E8F0
color15 #FFFFFF
EOF